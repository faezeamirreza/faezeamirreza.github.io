<!DOCTYPE html>

<title>امیررضا و فائزه — انتخاب طرح</title>

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600&family=Noto+Nastaliq+Urdu&family=Cormorant+Garamond:ital@1&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Vazirmatn,sans-serif;background:#f4efe7;color:#1e1a16;line-height:2;padding:50px 20px;text-align:center}
h1{font-family:'Noto Nastaliq Urdu',serif;font-weight:400;font-size:2.2rem;color:#9d7f4e;line-height:2.4}
.lat{font-family:'Cormorant Garamond',serif;font-style:italic;color:#8b8073;letter-spacing:.12em;margin-bottom:40px}
.grid{display:grid;gap:22px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));max-width:1000px;margin:auto}
a.card{display:block;text-decoration:none;color:inherit;background:#fffdf9;border:1px solid #1e1a1618;border-radius:14px;overflow:hidden;transition:.35s}
a.card:hover{transform:translateY(-6px);box-shadow:0 18px 40px #9d7f4e22}
a.card img{width:100%;height:170px;object-fit:cover}
.b{padding:20px}
.b h2{font-size:1.15rem;font-weight:600}
.b p{font-size:.9rem;color:#6d6459}
.tag{display:inline-block;font-size:.72rem;letter-spacing:.1em;color:#9d7f4e;border:1px solid #9d7f4e55;border-radius:30px;padding:2px 12px;margin-bottom:8px}
</style>
</head>
<body>
<h1>امیررضا و فائزه</h1>
<p class="lat">three designs — choose one</p>
<div class="grid">
  <a class="card" href="v1/"><img src="assets/rings-sm.jpg" alt="">
    <div class="b"><span class="tag">نسخه ۱</span><h2>طرح اصلاح‌شده</h2><p>همان طرح قبلی با همه اصلاحات درخواستی</p></div></a>
  <a class="card" href="v2/"><img src="assets/groom-sm.jpg" alt="">
    <div class="b"><span class="tag">نسخه ۲</span><h2>طرح سینمایی</h2><p>پاکت بازشونده، شب‌رنگ، حرکت و جلوه‌های مدرن</p></div></a>
  <a class="card" href="v3/"><img src="assets/bride-sm.jpg" alt="">
    <div class="b"><span class="tag">نسخه ۳</span><h2>طرح مجله‌ای</h2><p>مینیمال، تایپوگرافی درشت، فضای سفید</p></div></a>
</div>
</body>
</html>
